- id: zeng2026exploration
  category: preprint
  title: "Exploration via Activation-Space Steering for Reinforcement Learning with Verifiable Rewards"
  authors: "Yunan Zeng, <strong>Jinhao Jing</strong>, Xi Cheng, and Yuwang Wang"
  venue: arXiv e-prints
  display_year: 2026
  status: "arXiv:2610.27012"
  year: 2026
  abbr: Exploration
  color: "#7c3aed"
  preview: activation-space-exploration.png
  abstract: "Activation-space exploration clusters activation differences between correct and incorrect responses to the same problem into a bank of latent exploration vectors. These vectors steer later rollouts toward alternative paths. At equal budget, mean@8 over six math benchmarks exceeds GRPO by 4.87 points on Qwen3-1.7B-Base and 1.87 points on Qwen3-8B-Base."
  arxiv: https://arxiv.org/abs/2610.27012
  pdf: https://arxiv.org/pdf/2610.27012
  selected: true

